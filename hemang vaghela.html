<html>

<head>


<title>CSS Opacity Example</title>

<style>


.box1 {


background-color:salmon; 
opacity: 1;
}

.box2 { 
background-color: yellow; 
opacity: 50;

}

.box3

{background-color:papayawhip;
opacity: 0.90;
}

</style>

</head>




<body>

<div class="box1">

Opacity 1


</div>

<div class="box2">

Opacity 50

</div>



<div class="box3">

Opacity 0.90

</div>


</body>

</html>
